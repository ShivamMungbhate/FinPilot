version: '3.8'

services:
  ai-service:
    build:
      context: ./ai-service-python
      dockerfile: Dockerfile
    container_name: finpilot-ai-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpilot-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - ai-service
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - AI_SERVICE_URL=http://ai-service:5002
      - AI_SERVICE_TOKEN=${AI_SERVICE_TOKEN}
      - SESSION_SECRET=${SESSION_SECRET}
      - SHOW_DEMO_LOGIN=${SHOW_DEMO_LOGIN:-false}
      - ENABLE_PAYMENT_SIMULATION=${ENABLE_PAYMENT_SIMULATION:-false}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PAYPAL_ENV=${PAYPAL_ENV:-sandbox}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID}
    volumes:
      - backend-db:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: finpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://backend:4000/api
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api

volumes:
  backend-db:
